name: "trc: release"

on:
  push:
    tags: ["*-trc.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Upstream's large-disk builds, with the tag as COMMIT so `weed version` shows it: plain from binaries_release1.yml, full (all optional backends, rclone among them) from binaries_release4.yml.
      - name: Build
        working-directory: weed
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          ldflags="-s -w -extldflags -static -X github.com/seaweedfs/seaweedfs/weed/util/version.COMMIT=${GITHUB_REF_NAME}"
          go build -tags 5BytesOffset -ldflags "$ldflags" -o "$RUNNER_TEMP/large_disk/weed" .
          go build -tags 5BytesOffset,elastic,gocdk,rclone,sqlite,tarantool,tikv,ydb -ldflags "$ldflags" -o "$RUNNER_TEMP/full_large_disk/weed" .
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=()
          for v in large_disk full_large_disk; do
            tar -czf "linux_amd64_$v.tar.gz" -C "$RUNNER_TEMP/$v" weed
            sha256sum "linux_amd64_$v.tar.gz" > "linux_amd64_$v.tar.gz.sha256"
            assets+=("linux_amd64_$v.tar.gz" "linux_amd64_$v.tar.gz.sha256")
          done
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes "Upstream ${GITHUB_REF_NAME%-trc.*} plus the patches in [TRC-PATCHES.md](https://github.com/${GH_REPO}/blob/${GITHUB_REF_NAME}/TRC-PATCHES.md)."
