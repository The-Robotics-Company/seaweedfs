name: "trc: release"

on:
  push:
    tags: ["*-trc.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # upstream's binaries_release1.yml large-disk build, with the tag as COMMIT so `weed version` shows it
      - name: Build
        working-directory: weed
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -tags 5BytesOffset -ldflags "-s -w -extldflags -static -X github.com/seaweedfs/seaweedfs/weed/util/version.COMMIT=${GITHUB_REF_NAME}" -o "$RUNNER_TEMP/weed" .
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tar -czf linux_amd64_large_disk.tar.gz -C "$RUNNER_TEMP" weed
          sha256sum linux_amd64_large_disk.tar.gz > linux_amd64_large_disk.tar.gz.sha256
          gh release create "$GITHUB_REF_NAME" linux_amd64_large_disk.tar.gz linux_amd64_large_disk.tar.gz.sha256 \
            --verify-tag --title "$GITHUB_REF_NAME" --notes "Upstream ${GITHUB_REF_NAME%-trc.*} plus the patches in [TRC-PATCHES.md](https://github.com/${GH_REPO}/blob/${GITHUB_REF_NAME}/TRC-PATCHES.md)."
