name: "trc: upstream sync"

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      # GITHUB_TOKEN may not push upstream's changes to .github/workflows: this one needs contents and workflows write on this repo
      - name: Fast-forward master to upstream
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: gh api -X POST "repos/$GH_REPO/merge-upstream" -f branch=master
      - name: Open an issue for a new upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/seaweedfs/seaweedfs/releases/latest --jq .tag_name)
          gh api "repos/$GH_REPO/git/ref/tags/$tag" --silent 2>/dev/null && exit 0
          title="Upstream release $tag"
          [ -n "$(gh issue list --state all --search "\"$title\" in:title" --json number --jq '.[].number')" ] && exit 0
          gh issue create --title "$title" --body "Upstream published [$tag](https://github.com/seaweedfs/seaweedfs/releases/tag/$tag). Move \`trc\` onto it as TRC-PATCHES.md describes."
